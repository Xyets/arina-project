{% extends "base.html" %}
{% block content %}

<!-- Главный заголовок страницы -->
<div class="top-header">
    <h1 class="hello">FlowTip • Панель управления</h1>
</div>

<!-- Лента событий -->
<div class="row row-events">
    <div class="events-card">

        <div class="card-header">
            <h2>Лента событий</h2>
            <button id="clearLogsBtn" class="flow-btn-small">🧹</button>
        </div>

        <div id="logbox" class="event-list"></div>
    </div>
</div>

<!-- QR + Очередь вибраций -->
<div class="row row-bottom">

    <!-- QR -->
    <div class="qr-card">
        <h2>QR‑код для Lovense</h2>

        <img id="qrImage" class="qr-img" src="" alt="QR код">

        <button class="qr-refresh-btn" onclick="refreshQR()">
            🔄 Обновить QR‑код
        </button>
    </div>

    <!-- Очередь вибраций -->
    <div class="vibrations-card">

        <div class="card-header">
            <h2>Очередь вибраций</h2>
            <button id="clearQueueBtn" class="flow-btn-small">🧹</button>
        </div>

        <div id="queuebox" class="queue-list"></div>
    </div>
</div>

{% endblock %}
