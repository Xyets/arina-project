{% extends "base.html" %}
{% block content %}

<div id="app"
     data-user="{{ user }}"
     data-mode="{{ session['mode'] }}"
     data-profile="{{ current_profile }}">
</div>

<div class="status-card">
    <span>🔌 Подключение:</span>
    <strong id="wsStatus">Подключена</strong>
</div>

<div class="row row-events">
    <div class="events-card">
        <h2>Лента событий</h2>
        <div id="logbox" class="event-list"></div>
    </div>
</div>

<div class="row row-bottom">
    <div class="qr-card">
        <h2>QR‑код для Lovense</h2>
        <img src="{{ url_for('lovense.qrcode_image', profile_key=current_profile) }}" class="qr-img">
    </div>

    <div class="vibrations-card">
        <h2>Очередь вибраций</h2>
        <div id="queuebox" class="queue-list"></div>
    </div>
</div>

{% if session["mode"] == "public" %}
<div class="goal-panel" id="goalPanel">
    <h3 class="goal-title">🎯 {{ goal.title or "Цель не установлена" }}</h3>

    <div class="goal-bar-vertical">
        <div id="goalFillVertical"></div>
    </div>

    <div class="goal-values">
        <span id="goalCurrent">{{ goal.current }}</span> /
        <span id="goalTarget">{{ goal.target }}</span>
    </div>

    <button class="goal-new-btn" onclick="openGoalModal()">Новая цель</button>
</div>
{% endif %}

<div id="entryPopup" class="popup"></div>
<div id="toast" class="toast"></div>
<div id="vibrationTimersContainer"></div>

<div id="goalModal" class="modal">
    <div class="modal-content">
        <h3>Новая цель</h3>
        <form id="goalForm">
            <input name="title" placeholder="Название цели">
            <input name="target" placeholder="Сколько нужно" type="number">
            <button type="submit">Сохранить</button>
        </form>
    </div>
</div>

{% endblock %}
