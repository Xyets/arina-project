{% extends "base.html" %}
{% block content %}

<!-- Приветствие -->
<div class="top-header">
    <h1 class="hello">Привет, {{ user }} 👋</h1>
</div>

<!-- Статус подключения -->
<div class="status-card">
    <span>🔌 Подключение:</span>
    <strong id="wsStatus">Подключена</strong>
</div>

<!-- Лента событий -->
<div class="row row-events">
    <div class="events-card">

        <div class="card-header">
            <h2>Лента событий</h2>
            <button id="clearLogsBtn" class="flow-btn-small">🧹</button>
        </div>

        <div id="logbox" class="event-list"></div>
    </div>
</div>

<!-- QR + Очередь -->
<div class="row row-bottom">

    <!-- QR -->
    <div class="qr-card">
        <h2>QR‑код для Lovense</h2>
        <!-- если нужно — сюда можно добавить QR -->
    </div>

    <!-- Очередь вибраций -->
    <div class="vibrations-card">

        <div class="card-header">
            <h2>Очередь вибраций</h2>
            <button id="clearQueueBtn" class="flow-btn-small">🧹</button>
        </div>

        <div id="queuebox" class="queue-list"></div>
    </div>
</div>

{% endblock %}
