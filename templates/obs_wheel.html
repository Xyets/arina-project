<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Колесо фортуны</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    #wheelSvg {
      width: 500px;
      height: 500px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display:none;
    }

    #pointer {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -210px);
      width:60px;
      height:60px;
      z-index:10;
    }
  </style>
</head>
<body>

<!-- Сердечко -->
<svg id="pointer" width="60" height="60">
  <path d="M30 10 C40 0 55 0 55 20 C55 35 40 50 30 55 C20 50 5 35 5 20 C5 0 20 0 30 10 Z"
        fill="#00FF00" stroke="#008800" stroke-width="3"/>
</svg>

<!-- Колесо -->
<svg id="wheelSvg" viewBox="0 0 400 400">
  <g id="segments"></g>
</svg>

<script>
const profileKey = "{{ profile_key }}";
const ws = new WebSocket("wss://arinairina.duckdns.org/ws/");

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "hello",
    role: "obs",
    profile_key: profileKey
  }));
};

ws.onmessage = (event) => {
  let data;
  try { data = JSON.parse(event.data); } catch { return; }

  if (data.type === "wheel_spin" && data.profile === profileKey) {
      spinWheel(data.segments, data.winner_index);
  }
};

function drawWheel(segments) {
    const g = document.getElementById("segments");
    g.innerHTML = "";

    const count = segments.length;
    const angle = 360 / count;

    for (let i = 0; i < count; i++) {
        const start = (i * angle) * Math.PI / 180;
        const end = ((i + 1) * angle) * Math.PI / 180;

        const x1 = 200 + Math.cos(start) * 170;
        const y1 = 200 + Math.sin(start) * 170;
        const x2 = 200 + Math.cos(end) * 170;
        const y2 = 200 + Math.sin(end) * 170;

        const path = `
            M 200 200
            L ${x1} ${y1}
            A 170 170 0 0 1 ${x2} ${y2}
            Z
        `;

        const color = i % 2 === 0 ? "#FFC8DD" : "#FFAFCC";

        const label =
            (segments[i].name && segments[i].name.trim() !== "")
                ? segments[i].name
                : (segments[i].action || "");

        const textAngle = (i * angle) + angle / 2;

        const textRadius = 110;
        const tx = 200 + Math.cos(textAngle * Math.PI / 180) * textRadius;
        const ty = 200 + Math.sin(textAngle * Math.PI / 180) * textRadius;

        let html = `
            <path d="${path}" fill="${color}" stroke="#AF6D85" stroke-width="2"></path>
        `;

        if (label.trim() !== "") {
            html += `
                <text x="${tx}" y="${ty}"
                      font-size="26"
                      font-family="Arial"
                      fill="#333"
                      text-anchor="middle"
                      dominant-baseline="middle"
                      transform="rotate(${textAngle} ${tx} ${ty})">
                    ${label}
                </text>
            `;
        }

        g.innerHTML += html;
    }
}

function sendResult(seg) {
    ws.send(JSON.stringify({
        type: "wheel_result",
        profile: profileKey,
        segment: {
            name: seg.name,
            type: seg.type,          // vibration / action / retry
            strength: seg.strength,  // сила вибрации
            duration: seg.duration,  // время вибрации
            action: seg.action,      // текст действия
            chance: seg.chance       // шанс сегмента
        }
    }));
}

function spinWheel(segments, winnerIndex) {
    drawWheel(segments);

    const svg = document.getElementById("wheelSvg");
    const g = document.getElementById("segments");

    svg.style.display = "block";

    const count = segments.length;
    const angle = 360 / count;

    const finalAngle = (360 * 8) - (winnerIndex * angle) - angle / 2;

    let rotation = 0;
    let speed = 5;
    let maxSpeed = 25;
    let minSpeed = 0.2;
    let decelStart = finalAngle - 1440;

    let stopped = false;

    function animate() {
        if (stopped) return;

        if (speed < maxSpeed && rotation < 360) {
            speed += 0.3;
        }

        rotation += speed;

        if (rotation >= decelStart) {
            speed *= 0.965;
        }

        if (speed < minSpeed) {
            stopped = true;

            g.setAttribute("transform", `rotate(${rotation} 200 200)`);

            sendResult(segments[winnerIndex]);

            setTimeout(() => {
                svg.style.display = "none";
            }, 3000);

            return;
        }

        g.setAttribute("transform", `rotate(${rotation} 200 200)`);

        requestAnimationFrame(animate);
    }

    animate();
}
</script>

</body>
</html>
