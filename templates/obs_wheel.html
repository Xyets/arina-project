<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>OBS Колесо фортуны</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    #wheelCanvas {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      display:none;
    }

    /* Неподвижное сердечко */
    #pointer {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -210px);
      width:60px;
      height:60px;
      z-index:10;
    }
  </style>
</head>
<body>

  <!-- Сердечко -->
  <img id="pointer" src="data:image/svg+xml;utf8,
  <svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'>
    <path d='M30 10 C40 0 55 0 55 20 C55 35 40 50 30 55 C20 50 5 35 5 20 C5 0 20 0 30 10 Z'
          fill='%2300FF00' stroke='%23008800' stroke-width='3'/>
  </svg>' />

  <!-- Canvas для колеса -->
  <canvas id="wheelCanvas" width="500" height="500"></canvas>

  <!-- Winwheel.js -->
  <script src="https://cdn.jsdelivr.net/npm/winwheel@2.8.0/dist/Winwheel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    const profileKey = "{{ profile_key }}";

    const ws = new WebSocket("wss://arinairina.duckdns.org/ws/");

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "hello",
        role: "obs",
        profile_key: profileKey
      }));
    };

    ws.onmessage = (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }

      if (data.type === "wheel_spin" && data.profile === profileKey) {
        startWheel(data.segments, data.winner_index);
      }
    };

    let wheel;

    function startWheel(segments, winnerIndex) {
        const canvas = document.getElementById("wheelCanvas");
        canvas.style.display = "block";

        // Преобразуем сегменты в формат Winwheel
        const winwheelSegments = segments.map((seg, i) => ({
            fillStyle: i % 2 === 0 ? "#FFC8DD" : "#FFAFCC",
            text: seg.action || ""
        }));

        // Создаём колесо
        wheel = new Winwheel({
            canvasId: "wheelCanvas",
            numSegments: winwheelSegments.length,
            outerRadius: 240,
            textFontSize: 22,
            textAlignment: "outer",
            segments: winwheelSegments,
            animation: {
                type: "spinToStop",
                duration: 4,
                spins: 5,
                callbackFinished: "wheelFinished()"
            }
        });

        // Запускаем вращение
        wheel.startAnimation();

        // Устанавливаем точный сектор
        wheel.animation.stopAngle = (360 / segments.length) * winnerIndex;
    }

    function wheelFinished() {
        const winnerIndex = wheel.getIndicatedSegmentNumber() - 1;

        const seg = wheel.segments[winnerIndex];
        let segmentData;

        if (seg.text && seg.text.trim() !== "") {
            segmentData = {
                type: "action",
                action: seg.text
            };
        } else {
            segmentData = {
                type: "vibration",
                strength: 5,
                duration: 10
            };
        }

        ws.send(JSON.stringify({
            type: "wheel_result",
            profile: profileKey,
            segment: segmentData
        }));

        setTimeout(() => {
            document.getElementById("wheelCanvas").style.display = "none";
        }, 1000);
    }
  </script>

</body>
</html>
