<script>
const profileKey = "{{ profile_key }}";
const ws = new WebSocket("wss://arinairina.duckdns.org/ws/");

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "hello",
    role: "obs",
    profile_key: profileKey
  }));
};

ws.onmessage = (event) => {
  let data;
  try { data = JSON.parse(event.data); } catch { return; }

  if (data.type === "wheel_spin" && data.profile === profileKey) {
      const winnerIndex = Math.floor(Math.random() * data.segments.length);
      spinWheel(data.segments, winnerIndex);

  }
};

function drawWheel(segments) {
    const g = document.getElementById("segments");
    g.innerHTML = "";

    const count = segments.length;
    const angle = 360 / count;
    const offset = 90;

    const centerX = 152.79;
    const centerY = 192.55;

    const radius = 108;      // ⭐ новый радиус твоего круга
    const textRadius = 75;   // ⭐ текст ближе к центру

    for (let i = 0; i < count; i++) {

        const start = ((i * angle) + offset) * Math.PI / 180;
        const end = (((i + 1) * angle) + offset) * Math.PI / 180;

        const x1 = centerX + Math.cos(start) * radius;
        const y1 = centerY + Math.sin(start) * radius;
        const x2 = centerX + Math.cos(end) * radius;
        const y2 = centerY + Math.sin(end) * radius;

        const path = `
            M ${centerX} ${centerY}
            L ${x1} ${y1}
            A ${radius} ${radius} 0 0 1 ${x2} ${y2}
            Z
        `;

        const color = i % 2 === 0 ? "#FFC8DD" : "#FFAFCC";

        const label =
            (segments[i].name && segments[i].name.trim() !== "")
                ? segments[i].name
                : (segments[i].action || "");

        const textAngle = (i * angle) + angle / 2 + offset;

        const tx = centerX + Math.cos(textAngle * Math.PI / 180) * textRadius;
        const ty = centerY + Math.sin(textAngle * Math.PI / 180) * textRadius;

        let html = `
            <path d="${path}" fill="${color}" stroke="#AF6D85" stroke-width="2"></path>
        `;

        if (label.trim() !== "") {
            html += `
                <text x="${tx}" y="${ty}"
                      font-size="22"
                      font-family="Arial"
                      fill="#333"
                      text-anchor="middle"
                      dominant-baseline="middle"
                      transform="rotate(${textAngle} ${tx} ${ty})">
                    ${label}
                </text>
            `;
        }

        g.innerHTML += html;
    }
}

function sendResult(winnerIndex) {
    ws.send(JSON.stringify({
        type: "wheel_result",
        profile: profileKey,
        winner_index: winnerIndex
    }));
}


function spinWheel(segments, winnerIndex) {
    drawWheel(segments);

    const svg = document.getElementById("wheelSvg");
    const wheelInner = document.getElementById("wheelInner");

    svg.style.display = "block";

    const count = segments.length;
    const angle = 360 / count;

    const finalAngle = (360 * 8) - (winnerIndex * angle) - angle / 2 + 90;

    let rotation = 0;
    let speed = 5;
    let maxSpeed = 25;
    let minSpeed = 0.2;
    let decelStart = finalAngle - 1440;

    let stopped = false;

    function animate() {
        if (stopped) return;

        if (speed < maxSpeed && rotation < 360) {
            speed += 0.3;
        }

        rotation += speed;

        if (rotation >= decelStart) {
            speed *= 0.965;
        }

        if (speed < minSpeed) {
            stopped = true;

            wheelInner.setAttribute("transform", `rotate(${rotation} 152.79 192.55)`);

            sendResult(winnerIndex);

            setTimeout(() => {
                svg.style.display = "none";
            }, 3000);

            return;
        }

        wheelInner.setAttribute("transform", `rotate(${rotation} 152.79 192.55)`);

        requestAnimationFrame(animate);
    }

    animate();
}
</script>
