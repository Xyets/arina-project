<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SVG Колесо фортуны</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    #wheelSvg {
      width: 500px;
      height: 500px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display:none;
    }

    #pointer {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -210px);
      width:60px;
      height:60px;
      z-index:10;
    }
  </style>
</head>
<body>

<!-- Сердечко -->
<svg id="pointer" width="60" height="60">
  <path d="M30 10 C40 0 55 0 55 20 C55 35 40 50 30 55 C20 50 5 35 5 20 C5 0 20 0 30 10 Z"
        fill="#00FF00" stroke="#008800" stroke-width="3"/>
</svg>

<!-- Колесо -->
<svg id="wheelSvg" viewBox="0 0 400 400">
  <g id="segments"></g>
</svg>

<script>
const profileKey = "{{ profile_key }}";
const ws = new WebSocket("wss://arinairina.duckdns.org/ws/");

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "hello",
    role: "obs",
    profile_key: profileKey
  }));
};

ws.onmessage = (event) => {
  let data;
  try { data = JSON.parse(event.data); } catch { return; }

  if (data.type === "wheel_spin" && data.profile === profileKey) {
      spinWheel(data.segments, data.winner_index);
  }
};

function drawWheel(segments) {
    const g = document.getElementById("segments");
    g.innerHTML = "";

    const count = segments.length;
    const angle = 360 / count;

    for (let i = 0; i < count; i++) {
        const start = (i * angle) * Math.PI / 180;
        const end = ((i + 1) * angle) * Math.PI / 180;

        const x1 = 200 + Math.cos(start) * 170;
        const y1 = 200 + Math.sin(start) * 170;
        const x2 = 200 + Math.cos(end) * 170;
        const y2 = 200 + Math.sin(end) * 170;

        const path = `
            M 200 200
            L ${x1} ${y1}
            A 170 170 0 0 1 ${x2} ${y2}
            Z
        `;

        const color = i % 2 === 0 ? "#FFC8DD" : "#FFAFCC";

        g.innerHTML += `
            <path d="${path}" fill="${color}" stroke="#AF6D85" stroke-width="2"></path>
        `;
    }
}

function spinWheel(segments, winnerIndex) {
    drawWheel(segments);

    const svg = document.getElementById("wheelSvg");
    const g = document.getElementById("segments");

    svg.style.display = "block";

    const angle = 360 / segments.length;

    // 8 оборотов + остановка
    const finalAngle = (360 * 8) - (winnerIndex * angle);

    let rotation = 0;

    // ⭐ Очень медленный старт
    let speed = 5;

    // ⭐ Плавное ускорение
    let maxSpeed = 25;

    // ⭐ Мягкая остановка
    let minSpeed = 0.15;

    // ⭐ Замедление за 4 оборота до цели
    let decelStart = finalAngle - 1440;

    let target = finalAngle;

    function animate() {

        // Плавное ускорение в начале
        if (speed < maxSpeed && rotation < 360) {
            speed += 0.3;
        }

        rotation += speed;

        // Плавное замедление заранее
        if (rotation >= decelStart) {
            speed *= 0.965;
        }

        // Мягкая остановка
        if (speed < minSpeed) {
            rotation = target;
        }

        g.setAttribute("transform", `rotate(${rotation} 200 200)`);

        if (rotation < target) {
            requestAnimationFrame(animate);
        } else {
            // ⭐ ОСТАНОВИЛОСЬ — показываем 3 секунды
            sendResult(segments[winnerIndex]);

            setTimeout(() => {
                svg.style.display = "none";
            }, 30000); // ← 3 секунды пауза
        }
    }

    animate();
}

function sendResult(seg) {
    let segmentData;

    if (seg.action && seg.action.trim() !== "") {
        segmentData = {
            type: "action",
            action: seg.action
        };
    } else {
        segmentData = {
            type: "vibration",
            strength: 5,
            duration: 10
        };
    }

    ws.send(JSON.stringify({
        type: "wheel_result",
        profile: profileKey,
        segment: segmentData
    }));
}
</script>

</body>
</html>
