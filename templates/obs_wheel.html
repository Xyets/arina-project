<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Колесо фортуны</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');

    :root {
      --ft-pink: #f9a8d4;
      --ft-blush: #f7c8b8;
      --ft-lilac: #c9b9f5;
      --ft-mint: #aee6e6;
      --ft-pearl: #fff9fd;
      --ft-ink: #50454b;
      --ft-border: rgba(255, 255, 255, .62);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
    }

    #wheelSvg {
      width: 500px;
      height: 500px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      overflow: visible;
      filter:
        drop-shadow(0 0 7px rgba(249, 168, 212, .30))
        drop-shadow(0 0 16px rgba(174, 230, 230, .20));
    }

    #heartPointer {
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(139, 76, 119, .22));
    }

    #segments text {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke fill;
      filter: drop-shadow(0 2px 2px rgba(95, 53, 82, .18));
    }

    #winnerPopup {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.88);
      width: min(360px, calc(100vw - 40px));
      box-sizing: border-box;
      padding: 24px 28px 26px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,250,253,.97), rgba(255,222,239,.94) 52%, rgba(225,249,247,.96));
      box-shadow: 0 18px 55px rgba(112,65,98,.28), inset 0 1px 0 rgba(255,255,255,.95);
      color: var(--ft-ink);
      text-align: center;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease, visibility .28s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #winnerPopup.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    #winnerPopup .winner-kicker {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #b65f93;
      margin-bottom: 9px;
    }

    #winnerPopup .winner-emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: 54px;
      line-height: 1.25;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 5px rgba(170,100,145,.18));
    }

    #winnerPopup .winner-name {
      font-size: clamp(20px, 4vw, 27px);
      line-height: 1.45;
      font-weight: 800;
      overflow-wrap: anywhere;
      text-shadow: 0 1px 0 #fff;
    }

    #winnerPopup .winner-sparkle {
      margin-top: 12px;
      color: #bd7da7;
      letter-spacing: .35em;
      font-size: 16px;
    }

    @media (max-width: 520px) {
      #wheelSvg { width: min(500px, 100vw); height: auto; }
    }
  </style>
</head>

<script>
const profileKey = "{{ profile_key }}";
const ws = new WebSocket("wss://arinairina.duckdns.org/ws/");

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "hello",
    role: "obs",
    profile_key: profileKey
  }));
};

// Очередь вращений: одновременно крутится только одно колесо.
const wheelSpinQueue = [];
let wheelIsSpinning = false;

ws.onmessage = (event) => {
  let data;
  try { data = JSON.parse(event.data); } catch { return; }

  if (data.type === "wheel_spin" && data.profile === profileKey) {
      const winnerIndex = Number(data.winner_index);
      if (!Array.isArray(data.segments) || !data.segments.length ||
          !Number.isInteger(winnerIndex) || winnerIndex < 0 || winnerIndex >= data.segments.length ||
          !data.spin_id) {
          console.error("FlowTip wheel: invalid server-selected winner", data);
          return;
      }

      wheelSpinQueue.push({
          segments: data.segments,
          winnerIndex,
          spinId: data.spin_id
      });
      startNextWheelSpin();
      return;
  }

  if (data.type === "wheel_error" && data.profile === profileKey) {
      console.error("FlowTip wheel:", data.message || "Ошибка настроек колеса");
  }
};

function startNextWheelSpin() {
    if (wheelIsSpinning || wheelSpinQueue.length === 0) return;

    wheelIsSpinning = true;
    const nextSpin = wheelSpinQueue.shift();

    spinWheel(
        nextSpin.segments,
        nextSpin.winnerIndex,
        nextSpin.spinId,
        () => {
            wheelIsSpinning = false;
            startNextWheelSpin();
        }
    );
}

function drawWheel(segments) {
    const g = document.getElementById("segments");
    g.replaceChildren();

    const ns = "http://www.w3.org/2000/svg";
    const count = segments.length;
    const angle = 360 / count;
    const offset = 90;
    const centerX = 152.79;
    const centerY = 192.55;
    const radius = 108;
    const textRadius = count > 10 ? 68 : (count > 7 ? 72 : 76);
    const palette = [
        "url(#ftGlassPink)",
        "url(#ftGlassLilac)",
        "url(#ftGlassMint)",
        "url(#ftGlassPeach)"
    ];

    for (let i = 0; i < count; i++) {
        const start = ((i * angle) + offset) * Math.PI / 180;
        const end = (((i + 1) * angle) + offset) * Math.PI / 180;
        const x1 = centerX + Math.cos(start) * radius;
        const y1 = centerY + Math.sin(start) * radius;
        const x2 = centerX + Math.cos(end) * radius;
        const y2 = centerY + Math.sin(end) * radius;

        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`);
        path.setAttribute("fill", palette[i % palette.length]);
        path.setAttribute("stroke", "#fffaff");
        path.setAttribute("stroke-width", "1.5");
        path.setAttribute("stroke-linejoin", "round");
        g.appendChild(path);

        const segment = segments[i] || {};
        // На колесе показываем только эмодзи; название появится в карточке победителя.
        const emoji = typeof segment.emoji === "string" && segment.emoji.trim()
            ? segment.emoji.trim()
            : (segment.type === "retry" ? "🔁" : "🎯");

        const textAngle = (i * angle) + angle / 2 + offset;
        const tx = centerX + Math.cos(textAngle * Math.PI / 180) * textRadius;
        const ty = centerY + Math.sin(textAngle * Math.PI / 180) * textRadius;
        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", tx);
        text.setAttribute("y", ty);
        text.setAttribute("font-size", count > 10 ? "20" : (count > 7 ? "23" : "27"));
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("transform", `rotate(${textAngle} ${tx} ${ty})`);
        text.textContent = emoji;
        g.appendChild(text);
    }
}
function sendResult(winnerIndex, spinId) {
    ws.send(JSON.stringify({
        type: "wheel_result",
        profile: profileKey,
        winner_index: winnerIndex,
        spin_id: spinId
    }));
}


function showWinnerPopup(segment) {
    const popup = document.getElementById("winnerPopup");
    const emojiEl = document.getElementById("winnerEmoji");
    const nameEl = document.getElementById("winnerName");
    const winnerEmoji = segment && typeof segment.emoji === "string" && segment.emoji.trim()
        ? segment.emoji.trim()
        : (segment && segment.type === "retry" ? "🔁" : "🎯");
    const winnerName = segment && [segment.name, segment.label, segment.action, segment.description]
        .find(value => typeof value === "string" && value.trim()) || "当選！";

    emojiEl.textContent = winnerEmoji;
    nameEl.textContent = winnerName;
    popup.classList.add("show");
}

function hideWinnerPopup() {
    document.getElementById("winnerPopup")?.classList.remove("show");
}

function spinWheel(segments, winnerIndex, spinId, onComplete) {
    hideWinnerPopup();
    drawWheel(segments);

    const svg = document.getElementById("wheelSvg");
    const wheelInner = document.getElementById("wheelInner");

    // Каждый спин начинается с нулевого угла.
    wheelInner.setAttribute("transform", "rotate(0 152.79 192.55)");
    svg.style.display = "block";

    const count = segments.length;
    const angle = 360 / count;

    // Сектора рисуются от 90° (снизу), указатель расположен сверху (270°).
    // Поэтому центр winnerIndex совмещаем с верхним указателем.
    const targetAngle = (360 * 8) + 180 - (winnerIndex * angle) - angle / 2;
    const durationMs = 6000;
    const startedAt = performance.now();

    function animate(now) {
        const progress = Math.min(1, (now - startedAt) / durationMs);
        // Плавное замедление, при этом конечный угол всегда точный.
        const eased = 1 - Math.pow(1 - progress, 4);
        const rotation = targetAngle * eased;
        wheelInner.setAttribute("transform", `rotate(${rotation} 152.79 192.55)`);

        if (progress < 1) {
            requestAnimationFrame(animate);
            return;
        }

        // Фиксируем точный конечный угол, чтобы не зависеть от частоты кадров.
        wheelInner.setAttribute("transform", `rotate(${targetAngle} 152.79 192.55)`);
        sendResult(winnerIndex, spinId);

        // Скрываем колесо и показываем карточку того же сегмента по тому же индексу.
        setTimeout(() => {
            svg.style.display = "none";
            showWinnerPopup(segments[winnerIndex] || {});
            setTimeout(() => {
                hideWinnerPopup();
                if (typeof onComplete === "function") onComplete();
            }, 3500);
        }, 700);
    }

    requestAnimationFrame(animate);
}
</script>

</body>
</html>
