<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SVG Колесо фортуны</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    #wheelContainer {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:500px;
      height:500px;
      display:none;
    }

    #wheelSvg {
      width:100%;
      height:100%;
      transform-origin: 50% 50%;
    }

    #pointer {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -210px);
      width:60px;
      height:60px;
      z-index:10;
    }
  </style>
</head>
<body>

  <!-- Сердечко -->
  <svg id="pointer" width="60" height="60">
    <path d="M30 10 C40 0 55 0 55 20 C55 35 40 50 30 55 C20 50 5 35 5 20 C5 0 20 0 30 10 Z"
          fill="#00FF00" stroke="#008800" stroke-width="3"/>
  </svg>

  <!-- Колесо -->
  <div id="wheelContainer">
    <svg id="wheelSvg" viewBox="0 0 400 400">
      <g id="segments"></g>
    </svg>
  </div>

  <script>
    function drawWheel(segments) {
        const g = document.getElementById("segments");
        g.innerHTML = "";

        const count = segments.length;
        const angle = 360 / count;

        for (let i = 0; i < count; i++) {
            const start = (i * angle) * Math.PI / 180;
            const end = ((i + 1) * angle) * Math.PI / 180;

            const x1 = 200 + Math.cos(start) * 170;
            const y1 = 200 + Math.sin(start) * 170;
            const x2 = 200 + Math.cos(end) * 170;
            const y2 = 200 + Math.sin(end) * 170;

            const path = `
                M 200 200
                L ${x1} ${y1}
                A 170 170 0 0 1 ${x2} ${y2}
                Z
            `;

            const color = i % 2 === 0 ? "#FFC8DD" : "#FFAFCC";

            g.innerHTML += `
                <path d="${path}" fill="${color}" stroke="#AF6D85" stroke-width="2"></path>
            `;
        }
    }

    function spinWheel(segments, winnerIndex) {
        drawWheel(segments);

        const wheel = document.getElementById("wheelContainer");
        const svg = document.getElementById("wheelSvg");

        wheel.style.display = "block";

        const angle = 360 / segments.length;
        const finalAngle = (360 * 5) - (winnerIndex * angle);

        svg.style.transition = "transform 4s cubic-bezier(.17,.67,.83,.67)";
        svg.style.transform = `rotate(${finalAngle}deg)`;

        setTimeout(() => {
            console.log("Winner:", segments[winnerIndex]);
        }, 4200);
    }

    // Тест
    const testSegments = [
        { action: "A" },
        { action: "B" },
        { action: "C" },
        { action: "D" }
    ];

    spinWheel(testSegments, 2);
  </script>

</body>
</html>
