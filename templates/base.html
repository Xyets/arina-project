<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "FlowTip Live" }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=999">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="{{ url_for('static', filename='js/main.js') }}?v=2" defer></script>
</head>

<body>

<!-- Основной каркас -->
<div class="layout">

    <!-- Боковое меню -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo" id="sidebarLogo">
            <img src="{{ url_for('static', filename='icon.png') }}" alt="Logo">
            <span class="sidebar-title">FlowTip Live</span>
        </div>

        <div class="sidebar-mode">
            <span class="mode-title">Привет, {{ user }}</span>

            <div class="mode-switch">
                <span class="mode-label left">🌐 Публичный</span>

                <label class="switch">
                    <input type="checkbox" id="modeSwitch"
                        {% if session["mode"] == "private" %}checked{% endif %}>
                    <span class="slider"></span>
                </label>

                <span class="mode-label right">🔒 Частный</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a class="sidebar-item" href="{{ url_for('panel.beta_page') }}">
                <span class="icon">🏠</span>
                <span class="label">Главная</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('rules.rules_beta_page') }}">
                <span class="icon">⚙️</span>
                <span class="label">Правила</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('vip.vip_page') }}">
                <span class="icon">👑</span>
                <span class="label">Мемберы</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('reactions.reactions_page') }}">
                <span class="icon">🎭</span>
                <span class="label">Реакции</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('stats.stats_page') }}">
                <span class="icon">📊</span>
                <span class="label">Статистика</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="sidebar-item logout" href="{{ url_for('panel.logout') }}">
                <span class="icon">🚪</span>
                <span class="label">Выйти</span>
            </a>
        </div>
    </aside>

    <!-- Центральная область -->
    <main class="content">
        <div class="content-wrapper">

            <!-- ВАЖНО: app вынесен ВНЕ content-inner -->
            <div id="app"
                data-user="{{ user }}"
                data-mode="{{ session['mode'] }}"
                data-profile="{{ current_profile }}">
            </div>

            <!-- Весь SPA‑контент загружается сюда -->
            <div class="content-inner">
                {% block content %}
                {% endblock %}
            </div>

        </div>
    </main>

</div>

<!-- Постоянные элементы интерфейса -->
<div id="entryPopup" class="popup"></div>
<div id="toast" class="toast"></div>
<div id="vibrationOverlay"></div>

<!-- Круглая цель — ВСЕГДА в DOM -->
<div class="goal-circle" id="goalCircle" style="display:none;">


    <svg viewBox="0 0 100 100">
        <defs>
            <linearGradient id="goalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#AEE6E6"/>
                <stop offset="50%" stop-color="#F7C8B8"/>
                <stop offset="100%" stop-color="#F9A8D4"/>
            </linearGradient>
        </defs>

        <circle class="goal-bg" cx="50" cy="50" r="42"></circle>
        <circle class="goal-progress-ring" cx="50" cy="50" r="42"></circle>
    </svg>

    <div class="goal-circle-text">
        <div id="goalCircleTitle"></div>
        <div id="goalCircleValues">
            <span id="goalCurrent"></span> /
            <span id="goalTarget"></span>
        </div>
    </div>

    <button class="goal-circle-btn" onclick="openGoalModal()">✏️</button>
</div>

<!-- Модалка цели -->
<div id="goalModal" class="modal">
    <div class="goal-modal-content">

        <button class="goal-close-btn" onclick="closeGoalModal()">✕</button>

        <h3 class="goal-modal-title">Новая цель</h3>

        <form id="goalForm" class="goal-form">
            <input name="title" placeholder="Название цели" class="goal-input">
            <input name="target" placeholder="Сколько нужно" type="number" class="goal-input">

            <button type="submit" class="goal-save-btn">Сохранить</button>
        </form>

    </div>
</div>


</body>
</html>
