<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Панель управления" }}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

<div class="layout">

    <!-- Боковое меню -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="{{ url_for('static', filename='icon.png') }}" alt="Logo">
            <span>Arina Panel</span>
        </div>

        <nav class="sidebar-menu">
            <a href="{{ url_for('panel.index') }}">🏠 Главная</a>
            <a href="{{ url_for('panel.beta_page') }}">🧪 Новая панель</a>
            <a href="{{ url_for('rules.rules_page') }}">⚙️ Правила</a>
            <a href="{{ url_for('vip.vip_page') }}">👑 Мемберы</a>
            <a href="{{ url_for('reactions.reactions_page') }}">🎭 Реакции</a>
            <a href="{{ url_for('stats.stats_page') }}">📊 Статистика</a>
        </nav>

        <div class="sidebar-footer">
            <a href="{{ url_for('panel.logout') }}">🚪 Выйти</a>
        </div>
    </aside>

    <!-- Основной контент -->
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

</div>

<!-- JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
