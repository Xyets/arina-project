<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "CyberSync Live" }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=999">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="{{ url_for('static', filename='js/main.js') }}?v=2" defer></script>
</head>

<body>

<!-- Глобальные данные -->
<div id="app"
     data-user="{{ user }}"
     data-mode="{{ session['mode'] }}"
     data-profile="{{ current_profile }}">
</div>

<!-- Основной каркас -->
<div class="layout">

    <!-- Боковое меню -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo" id="sidebarLogo">
            <img src="{{ url_for('static', filename='icon.png') }}" alt="Logo">
            <span class="sidebar-title">FlowTip Live</span>
        </div>

        <div class="sidebar-mode">
            <span class="mode-title">Привет, {{ user }}</span>

            <div class="mode-switch">
                <span class="mode-label left">🌐 Публичный</span>

                <label class="switch">
                    <input type="checkbox" id="modeSwitch"
                        {% if session["mode"] == "private" %}checked{% endif %}>
                    <span class="slider"></span>
                </label>

                <span class="mode-label right">🔒 Частный</span>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a class="sidebar-item" href="{{ url_for('panel.beta_page') }}">
                <span class="icon">🏠</span>
                <span class="label">Главная</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('rules.rules_page') }}">
                <span class="icon">⚙️</span>
                <span class="label">Правила</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('vip.vip_page') }}">
                <span class="icon">👑</span>
                <span class="label">Мемберы</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('reactions.reactions_page') }}">
                <span class="icon">🎭</span>
                <span class="label">Реакции</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('stats.stats_page') }}">
                <span class="icon">📊</span>
                <span class="label">Статистика</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="sidebar-item logout" href="{{ url_for('panel.logout') }}">
                <span class="icon">🚪</span>
                <span class="label">Выйти</span>
            </a>
        </div>
    </aside>

    <!-- Центральная область -->
    <main class="content">
        <div class="content-wrapper">
            <div class="content-inner">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

</div> <!-- /layout -->

<!-- Постоянные элементы интерфейса -->

{% if session["mode"] == "public" %}
<div class="goal-panel" id="goalPanel">
    <h3 class="goal-title">🎯 {{ goal.title or "Цель не установлена" }}</h3>

    <div class="goal-bar-vertical">
        <div id="goalFillVertical"></div>
    </div>

    <div class="goal-values">
        <span id="goalCurrent">{{ goal.current }}</span> /
        <span id="goalTarget">{{ goal.target }}</span>
    </div>

    <button class="goal-new-btn" onclick="openGoalModal()">Новая цель</button>
</div>
{% endif %}

<div id="entryPopup" class="popup"></div>
<div id="toast" class="toast"></div>
<div id="vibrationTimersContainer"></div>

<div id="goalModal" class="modal">
    <div class="modal-content">
        <h3>Новая цель</h3>
        <form id="goalForm">
            <input name="title" placeholder="Название цели">
            <input name="target" placeholder="Сколько нужно" type="number">
            <button type="submit">Сохранить</button>
        </form>
        <button class="modal-close-btn" onclick="closeGoalModal()">Закрыть</button>
    </div>
</div>

</body>
</html>
