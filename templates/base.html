<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "CyberSync Live" }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=999">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="{{ url_for('static', filename='js/main.js') }}?v=2" defer></script>
</head>

<body>

<div id="app"
     data-user="{{ user }}"
     data-mode="{{ session['mode'] }}"
     data-profile="{{ current_profile }}">
</div>


<div class="layout">

    <!-- Боковое меню -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo" id="sidebarLogo">
            <img src="{{ url_for('static', filename='icon.png') }}" alt="Logo">
            <span class="sidebar-title">FlowTip Live</span>
        </div>

        <div class="sidebar-mode">
            <span class="mode-title">Привет, {{ user }}</span>

            <div class="mode-switch">
                <span class="mode-label left">🌐 Публичный</span>

                <label class="switch">
                    <input type="checkbox" id="modeSwitch"
                        {% if session["mode"] == "private" %}checked{% endif %}>
                    <span class="slider"></span>
                </label>

                <span class="mode-label right">🔒 Частный</span>
            </div>
        </div>



        <nav class="sidebar-menu">

            <a class="sidebar-item" href="{{ url_for('panel.beta_page') }}">
                <span class="icon">🏠</span>
                <span class="label">Главная</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('rules.rules_page') }}">
                <span class="icon">⚙️</span>
                <span class="label">Правила</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('vip.vip_page') }}">
                <span class="icon">👑</span>
                <span class="label">Мемберы</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('reactions.reactions_page') }}">
                <span class="icon">🎭</span>
                <span class="label">Реакции</span>
            </a>

            <a class="sidebar-item" href="{{ url_for('stats.stats_page') }}">
                <span class="icon">📊</span>
                <span class="label">Статистика</span>
            </a>

        </nav>

        <div class="sidebar-footer">
            <a class="sidebar-item logout" href="{{ url_for('panel.logout') }}">
                <span class="icon">🚪</span>
                <span class="label">Выйти</span>
            </a>
        </div>
    </aside>

    <!-- Основной контент -->
    <main class="content">
        <div class="content-wrapper">
            <div class="content-inner">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

</div>

</body>
</html>
